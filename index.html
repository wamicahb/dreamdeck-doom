<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DOOM &middot; Dream Deck Arcade</title>

    <!--
      Dream Deck Arcade - DOOM
      Designed and built 100% by wamicahb@. Original work.

      The Dream Deck panel can't run DOOM inline: the Dreamscape console ships a strict CSP
      (`script-src 'self'` + `frame-src 'none'`) that blocks all eval/WebAssembly AND all iframes,
      so the DOOM tile opens THIS page in a new tab instead. Host it anywhere with a normal CSP
      (GitHub Pages, etc.) and point the games list's DOOM_URL at it.

      DOOM runs on js-dos (DOSBox compiled to WebAssembly) booting the freely-redistributable DOOM
      shareware. js-dos owns the canvas here, so IT scales the game to fill the frame (archive.org's
      embedded player renders DOOM at native 320x200 and won't upscale, which is why we don't use it).
      The bundle is served from GitHub via jsDelivr, which sends CORS headers so js-dos can fetch it.
      To use a different game, change BUNDLE_URL to any js-dos (.jsdos) bundle.
    -->

    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css" />
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --text-2: #9198a1;
        --accent: #4c9eff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        flex: 0 0 auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
      }
      .brand .mono {
        color: var(--accent);
        font-size: 18px;
      }
      .sep {
        color: var(--text-2);
        opacity: 0.5;
      }
      .title {
        font-weight: 800;
        letter-spacing: 3px;
      }
      .spacer {
        margin-left: auto;
      }
      .hint {
        color: var(--text-2);
        font-size: 12px;
      }
      main {
        flex: 1 1 auto;
        position: relative;
        min-height: 0;
        background: #000;
      }
      #dos {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .fallback {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        padding: 24px;
      }
      .fallback h2 {
        margin: 0;
        letter-spacing: 2px;
      }
      .fallback p {
        margin: 0;
        max-width: 460px;
        color: var(--text-2);
        line-height: 1.5;
        font-size: 14px;
      }
      .credit {
        padding: 6px 16px;
        border-top: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-2);
        font-size: 11px;
        text-align: center;
        flex: 0 0 auto;
      }
      .credit a {
        color: var(--accent);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">Dream Deck</span>
      <span class="sep">&middot;</span>
      <span class="title">DOOM</span>
    </header>

    <main>
      <div id="dos"></div>
      <div class="fallback" id="fallback">
        <h2>Couldn't load DOOM</h2>
        <p id="fallback-msg">
          The js-dos emulator or the game bundle didn't load. Check your connection, or swap BUNDLE_URL
          in this page's source for another js-dos bundle.
        </p>
      </div>
    </main>

    <div class="credit">
      Dream Deck &middot; designed and built 100% by wamicahb@ &middot; DOOM is id Software's shareware, run via
      <a href="https://js-dos.com" target="_blank" rel="noopener">js-dos</a>
    </div>

    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
    <script>
      // DOOM shareware bundle, hosted next to this page in the same repo (same-origin, no CORS). This
      // copy has a DEFAULT.CFG that enables Sound Blaster so the game has sound. Swap for any js-dos
      // (.jsdos) bundle to change the game.
      var BUNDLE_URL = "doom-shareware.jsdos";

      function showFallback(msg) {
        var fb = document.getElementById("fallback");
        if (msg) document.getElementById("fallback-msg").textContent = msg;
        if (fb) fb.style.display = "flex";
      }

      if (typeof Dos !== "function") {
        showFallback("The js-dos emulator script failed to load from its CDN. You may be offline, or the host is blocking it.");
      } else {
        try {
          // kiosk: hide js-dos' side UI and boot straight into the game; it scales to fill #dos.
          Dos(document.getElementById("dos"), {
            url: BUNDLE_URL,
            kiosk: true,
            theme: "dark",
            noCloud: true,
            mouseCapture: true,
          });
        } catch (e) {
          showFallback("DOOM failed to start: " + (e && e.message ? e.message : e));
        }
      }
    </script>
  </body>
</html>
